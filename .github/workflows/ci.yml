name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read

jobs:
  build:
    name: Build (downloads abevjava.jar from NAV)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A gradle-wrapper.jar integritasanak ellenorzese (supply-chain vedelem)
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Az abevjava.jar a NAV zart ANYK szoftverebol szarmazik, ezert NINCS a
      # repoban (compileOnly fuggoseg). A CI build-idoben letolti a hivatalos
      # ANYK telepitocsomagot, es kicsomagolja belole az abevjava.jar-t az
      # application/ konyvtarba. Ezt SEM commitoljuk, csak a futo job hasznalja.
      - name: Download ANYK (abevjava.jar) from NAV
        run: |
          wget -q --tries=3 --timeout=120 \
            "https://nav.gov.hu/pfile/programFile?path=/nyomtatvanyok/letoltesek/nyomtatvanykitolto_programok/nyomtatvany_apeh/keretprogramok/AbevJava" \
            -O abevjava_install.jar
          unzip -q -o abevjava_install.jar "application/abevjava.jar" -d anyk
          ls -la anyk/application/abevjava.jar

      - name: Build (installDist)
        run: ./gradlew installDist -PanykHome=anyk/application --stacktrace
