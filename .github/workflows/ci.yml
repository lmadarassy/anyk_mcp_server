name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read

jobs:
  validate:
    name: Validate build (no abevjava.jar)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A gradle-wrapper.jar integritasanak ellenorzese (supply-chain vedelem)
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # FONTOS: az abevjava.jar a NAV zart ANYK szoftvereből szarmazik es NINCS
      # a repoban (compileOnly fuggoseg). Igy a teljes `compileJava` GitHubon nem
      # futtathato. A CI azt ellenorzi, ami jar nelkul is ertelmes:
      #   - a Gradle wrapper integritasat,
      #   - hogy a build-script ervenyes es a konfiguracio kiertekelheto,
      #   - hogy a publikus (mavenCentral) fuggosegek feloldhatok.
      # A tenyleges forditas es a dist osszeallitasa lokalisan tortenik, ahol
      # rendelkezesre all az ANYK telepites:
      #   ./gradlew installDist -PanykHome=/eleresi/ut/az/abevjava
      - name: Verify build configuration
        run: ./gradlew help --stacktrace

      - name: Resolve public dependencies
        run: ./gradlew dependencies --configuration runtimeClasspath --stacktrace
